<!DOCTYPE html>
<html lang="th" data-theme="dracula">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Vacancies | BigBobAi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI (ล็อกเวอร์ชัน 4 เพื่อให้ชื่อคลาสไม่เปลี่ยน) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>

<body class="flex flex-col min-h-screen">
    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Navigation Bar -->
        <!-- Navigation Bar -->
        <nav class="bg-gray-800 text-white p-3 sticky top-0 z-50 rounded-lg mb-8">
            <div class="w-full flex justify-between items-center px-4 md:px-12">
                <a href="index.html" class="flex items-center gap-3">
                    <!-- วงกลมใส่รูป Logo (ขนาดเล็ก) -->
                    <div
                        class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center overflow-hidden border-2 border-blue-400 flex-shrink-0 shadow-md">
                        <img src="image/image.png" alt="BigBobAi Logo" class="w-full h-full object-cover"
                            onerror="this.onerror=null; this.src='https://via.placeholder.com/150/2563eb/ffffff?text=AI';">
                    </div>
                    <span
                        class="text-3xl font-bold bg-gradient-to-r from-blue-400 bg-clip-text text-transparent">BigBobAi</span>
                </a>

                <!-- :ซ่อนหน้าจอคอมพิวเตอร์ เมื่อลดขนาดหน้าต่าง -->
                <ul class="hidden md:flex space-x-6 text-lg">
                    <li><a href="index.html" class="hover:text-blue-400 font-bold transition-colors">Home</a></li>
                    <li><a href="jobs.html" class="text-blue-400 font-bold transition-colors">Jobs</a></li>
                    <li><a href="courses.html" class="hover:text-blue-400 font-bold transition-colors">Courses</a></li>
                    <li><a href="about.html" class="hover:text-blue-400 font-bold transition-colors">About us</a></li>
                </ul>

                <!-- เมนู Hamburger มือถือ -->
                <div class="dropdown dropdown-end md:hidden">
                    <label tabindex="0" class="btn btn-ghost btn-circle swap swap-rotate text-white">
                        <input type="checkbox" />

                        <!-- ไอคอน แฮมเบอร์เกอร์ -->
                        <svg class="swap-off fill-current" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                            viewBox="0 0 512 512">
                            <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
                        </svg>

                        <!-- ไอคอน กากบาท X -->
                        <svg class="swap-on fill-current" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                            viewBox="0 0 512 512">
                            <polygon
                                points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49" />
                        </svg>
                    </label>

                    <!-- รายการเมนูเมื่อกดบนมือถือ -->
                    <ul tabindex="0"
                        class="menu menu-md dropdown-content mt-3 z-[1] p-3 shadow-xl bg-gray-800 rounded-box w-52 border border-gray-700 space-y-2">
                        <li><a href="index.html" class="hover:text-blue-400 font-bold">Home</a></li>
                        <li><a href="jobs.html" class="text-blue-400 font-bold">Jobs</a></li>
                        <li><a href="courses.html" class="hover:text-blue-400 font-bold">Courses</a></li>
                        <li><a href="about.html" class="hover:text-blue-400 font-bold">About us</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-blue-400 mb-3">ตำแหน่งงานด้าน AI และดิจิทัล</h1>
            <p class="text-lg text-gray-300">Job Vacancies · ตำแหน่งงานยุคใหม่ที่ใช้ AI สนับสนุน เปิดรับสมัครทั้งหมด
                <span id="job-count" class="font-bold text-blue-400">0</span> ตำแหน่ง
            </p>
        </header>

        <!-- Job cards (สร้างจากข้อมูลด้านล่าง) -->
        <section id="job-list" class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start"></section>
    </main>

    <footer class="bg-gray-800 text-gray-400 text-center py-6 mt-12">
        <div class="container mx-auto">
            <p>&copy; 2026 BigBobAi. All rights reserved.</p>
        </div>
    </footer>

</body>
<script src="\Midterm_project\script\showjobs.js"></script>

</html>
